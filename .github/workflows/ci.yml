name: paramminer-go-release-gates
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  linux-release-gates:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.9', '1.27.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
          cache: false
      - run: go version && go env GOOS GOARCH
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go test -shuffle=on -count=3 ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go mod verify
      - run: python3 tests/independent_cli_probes.py
      - name: Strict HTTP authority independent CLI regression
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/paramminer-authority" ./cmd/paramminer-go
          python3 -B tests/authority_cli_probes.py "$RUNNER_TEMP/paramminer-authority"
      - name: Temporal baseline and short-burst falsification regression
        run: python3 -B tests/temporal_drift_cli_probes.py
      - run: python3 -B -m unittest discover -s tests -p test_\*.py -v
      - name: Staticcheck v0.8.1
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck v1.9.0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            python: python3
          - os: macos-15
            goos: darwin
            goarch: arm64
            python: python3
          - os: windows-2025
            goos: windows
            goarch: amd64
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
          go version
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          "${{ matrix.python }}" tests/independent_cli_probes.py
          binary="$RUNNER_TEMP/paramminer-native-smoke"
          if [ "${{ matrix.goos }}" = "windows" ]; then binary="$binary.exe"; fi
          go build -trimpath -buildvcs=false -o "$binary" ./cmd/paramminer-go
          "${{ matrix.python }}" tests/mapped_loopback_cli_probes.py "$binary"
          "${{ matrix.python }}" -B tests/authority_cli_probes.py "$binary"
          "${{ matrix.python }}" -B tests/temporal_drift_cli_probes.py
          "${{ matrix.python }}" -B -m unittest discover -s tests -p test_\*.py -v
